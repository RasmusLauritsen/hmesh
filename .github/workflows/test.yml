name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l main.go internal)"
      - name: Go tests and race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Python reference tests
        run: python3 -m unittest -v
      - name: Build hmesh
        run: go build -o bin/hmesh .
