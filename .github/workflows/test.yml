name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l main.go internal)"
      - name: Go tests and race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build hmesh
        run: go build -o bin/hmesh .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reference output safety tests (offline)
        run: python3 -m unittest discover -s tools/reference -p 'test_*.py'
